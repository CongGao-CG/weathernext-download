<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="500" viewBox="-60 0 1260 500" role="img" aria-labelledby="title description">
  <title id="title">WeatherNext model input and output flow</title>
  <desc id="description">Atmospheric, surface, static, and time inputs enter a WeatherNext model, which produces gridded weather and cyclone outputs.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="feedback-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="-60" width="1260" height="500" rx="18" fill="#f8fafc"/>

  <text x="190" y="42" text-anchor="middle" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Model inputs</text>
  <text x="605" y="42" text-anchor="middle" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Forecast model</text>
  <text x="1010" y="42" text-anchor="middle" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Model outputs</text>

  <g filter="url(#shadow)">
    <rect x="40" y="70" width="300" height="88" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="40" y="176" width="300" height="88" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="40" y="282" width="300" height="88" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  </g>

  <text x="62" y="105" fill="#1e3a8a" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Atmospheric state</text>
  <text x="62" y="133" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="15">Six variables at thirteen pressure levels</text>

  <text x="62" y="211" fill="#1e3a8a" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Surface state</text>
  <text x="62" y="239" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="15">Surface and near-surface conditions</text>

  <text x="62" y="307" fill="#1e3a8a" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Context</text>
  <text x="62" y="330" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="14">Terrain elevation and land vs. ocean</text>
  <text x="62" y="352" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="14">Time of year and time of day</text>

  <path d="M 340 114 H 405 V 220 H 445" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 340 220 H 445" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 340 326 H 405 V 220 H 445" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="455" y="135" width="300" height="170" rx="18" fill="#0f172a"/>
  </g>
  <text x="605" y="191" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">WeatherNext</text>
  <text x="605" y="225" text-anchor="middle" fill="#bfdbfe" font-family="Inter, Arial, sans-serif" font-size="17">WN-C · WN2</text>
  <rect x="519" y="251" width="172" height="30" rx="15" fill="#1e3a8a"/>
  <text x="605" y="272" text-anchor="middle" fill="#dbeafe" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Downloaded NPZ weights</text>

  <path d="M 755 220 H 810 M 810 102 V 326" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <g fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 810 102 H 850"/>
    <path d="M 810 176 H 850"/>
    <path d="M 810 250 H 850"/>
    <path d="M 810 326 H 850"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="860" y="70" width="300" height="64" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <rect x="860" y="144" width="300" height="64" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <rect x="860" y="218" width="300" height="64" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <rect x="860" y="292" width="300" height="78" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  </g>

  <text x="882" y="97" fill="#065f46" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Atmospheric state</text>
  <text x="882" y="120" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="14">Six variables at thirteen pressure levels</text>
  <text x="882" y="171" fill="#065f46" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Surface state</text>
  <text x="882" y="194" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="14">Surface and near-surface conditions</text>
  <text x="882" y="245" fill="#065f46" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Precipitation</text>
  <text x="882" y="268" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="14">Six-hour accumulated precipitation</text>

  <text x="882" y="318" fill="#9a3412" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Cyclone predictions</text>
  <text x="882" y="340" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="15">Existence, intensity, wind radii,</text>
  <text x="882" y="360" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="15">and central pressure</text>

  <path d="M 1160 102 H 1180 V 405 H 0 V 114 H 40" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#feedback-arrow)"/>
  <path d="M 1160 176 H 1180" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="8 7"/>
  <path d="M 0 220 H 40" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="8 7" stroke-linecap="round" marker-end="url(#feedback-arrow)"/>
  <rect x="355" y="390" width="490" height="30" rx="15" fill="#f8fafc"/>
  <text x="600" y="411" text-anchor="middle" fill="#0369a1" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Predicted atmospheric and surface fields become the next inputs</text>

  <text x="600" y="472" text-anchor="middle" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="14">One model pass produces both weather fields and cyclone-specific fields.</text>
</svg>
