<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">WeatherNext model input and output flow</title>
  <desc id="description">Atmospheric, surface, static, and time inputs enter a WeatherNext model, which produces gridded weather and cyclone outputs.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="440" rx="18" fill="#f8fafc"/>

  <text x="40" y="42" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Model inputs</text>
  <text x="470" y="42" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Forecast model</text>
  <text x="865" y="42" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Model outputs</text>

  <g filter="url(#shadow)">
    <rect x="40" y="70" width="300" height="88" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="40" y="176" width="300" height="88" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="40" y="282" width="300" height="88" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  </g>

  <text x="62" y="105" fill="#1e3a8a" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Atmospheric state</text>
  <text x="62" y="133" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="15">Six variables at thirteen pressure levels</text>

  <text x="62" y="211" fill="#1e3a8a" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Surface state</text>
  <text x="62" y="239" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="15">Surface and near-surface conditions</text>

  <text x="62" y="317" fill="#1e3a8a" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Context</text>
  <text x="62" y="345" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="15">Static surface fields and time forcings</text>

  <path d="M 340 114 H 405 V 220 H 445" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 340 220 H 445" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 340 326 H 405 V 220 H 445" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="455" y="135" width="300" height="170" rx="18" fill="#0f172a"/>
  </g>
  <text x="605" y="191" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">WeatherNext</text>
  <text x="605" y="225" text-anchor="middle" fill="#bfdbfe" font-family="Inter, Arial, sans-serif" font-size="17">Cyclones · Cyclones Mini · WN2</text>
  <rect x="519" y="251" width="172" height="30" rx="15" fill="#1e3a8a"/>
  <text x="605" y="272" text-anchor="middle" fill="#dbeafe" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Downloaded NPZ weights</text>

  <path d="M 755 220 H 810 V 126 H 850" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 755 220 H 810 V 314 H 850" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="860" y="70" width="300" height="112" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <rect x="860" y="258" width="300" height="112" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  </g>

  <text x="882" y="111" fill="#065f46" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Gridded weather</text>
  <text x="882" y="139" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="15">Atmosphere, surface, and precipitation</text>
  <text x="882" y="162" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="14">Forecast values for the next time step</text>

  <text x="882" y="299" fill="#9a3412" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Cyclone predictions</text>
  <text x="882" y="327" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="15">Existence, intensity, wind radii,</text>
  <text x="882" y="350" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="15">and central pressure</text>

  <text x="600" y="412" text-anchor="middle" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="14">One model pass produces both weather fields and cyclone-specific fields.</text>
</svg>
